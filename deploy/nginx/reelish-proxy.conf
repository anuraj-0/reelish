# /etc/nginx/snippets/reelish-proxy.conf — shared proxy settings for Reelish.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite: never pass on client-supplied values
proxy_set_header Connection "";
client_max_body_size 16k;
# No X-Forwarded-Proto: with it, Next 16 proxies the 404 rewrite in proxy.ts to https://localhost:3101 (plain HTTP) → 500.
