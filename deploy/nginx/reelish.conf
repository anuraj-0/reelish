# /etc/nginx/snippets/reelish.conf — Reelish at https://deepclean.app/reelish
# Next.js standalone on 127.0.0.1:3101 (built with basePath /reelish). Include inside the deepclean.app 443 block.
# ^~ stops the host's regex locations (.css/.js/.png caching, /index rewrites) from matching Reelish paths.
location = /reelish {
    limit_req zone=reelish_all burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3101;
    include snippets/reelish-proxy.conf;
}
location ^~ /reelish/ {
    limit_req zone=reelish_all burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3101;
    include snippets/reelish-proxy.conf;

    # Starting a job: tight per-IP limit at the edge (the app also limits per hour). Polling /api/jobs/<id> is not affected.
    location ~ ^/reelish/(api/jobs|start)$ {
        limit_req zone=reelish_start burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3101;
        include snippets/reelish-proxy.conf;
    }
}
